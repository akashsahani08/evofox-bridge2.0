name: Build EvoFox Bridge APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Complete Clean & Build Pure Java Project
      run: |
        # Purana saara kachra (res, java, kotlin, tests) साफ!
        rm -rf app/src/main/java app/src/main/kotlin app/src/main/res app/src/test app/src/androidTest
        mkdir -p app/src/main/java/com/evofox/bridge

        # 1. Root build.gradle ko bilkul simple aur clean banana
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:7.0.4"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 2. App build.gradle (Bina kisi Kotlin ya फालतू dependency ke)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            compileSdkVersion 31
            defaultConfig {
                applicationId "com.evofox.bridge"
                minSdkVersion 21
                targetSdkVersion 31
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        dependencies {
        }
        EOF

        # 3. Clean AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.evofox.bridge">
            <uses-permission android:name="android.permission.BLUETOOTH" />
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
            <application
                android:allowBackup="true"
                android:label="EvoFox Bridge"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 4. Pure Java MainActivity.java (100% Guaranteed Compile)
        cat << 'EOF' > app/src/main/java/com/evofox/bridge/MainActivity.java
        package com.evofox.bridge;

        import android.app.Activity;
        import android.os.Bundle;
        import android.view.Gravity;
        import android.view.InputDevice;
        import android.view.KeyEvent;
        import android.view.MotionEvent;
        import android.widget.TextView;

        public class MainActivity extends Activity {
            private TextView statusText;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                statusText = new TextView(this);
                statusText.setText("EvoFox Bridge Ready!\n\nConnect controller via OTG\nand press any button to test.");
                statusText.setTextSize(20f);
                statusText.setGravity(Gravity.CENTER);
                setContentView(statusText);
            }

            @Override
            public boolean dispatchKeyEvent(KeyEvent event) {
                if (event.getAction() == KeyEvent.ACTION_DOWN) {
                    statusText.setText("Button Pressed: KeyCode " + event.getKeyCode());
                    return true;
                } else if (event.getAction() == KeyEvent.ACTION_UP) {
                    statusText.setText("Button Released: KeyCode " + event.getKeyCode());
                    return true;
                }
                return super.dispatchKeyEvent(event);
            }

            @Override
            public boolean dispatchGenericMotionEvent(MotionEvent event) {
                if ((event.getSource() & InputDevice.SOURCE_JOYSTICK) != 0) {
                    float x = event.getAxisValue(MotionEvent.AXIS_X);
                    float y = event.getAxisValue(MotionEvent.AXIS_Y);
                    statusText.setText("Joystick Moved:\nX: " + x + "\nY: " + y);
                    return true;
                }
                return super.dispatchGenericMotionEvent(event);
            }
        }
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EvoFox-Bridge-App
        path: app/build/outputs/apk/debug/app-debug.apk
