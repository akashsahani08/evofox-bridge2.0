name: Build EvoFox Bridge APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Auto-Fix Project Structure and Code
      run: |
        rm -rf app/src/main/java app/src/main/kotlin app/src/main/res/layout app/src/test app/src/androidTest
        mkdir -p app/src/main/java/com/evofox/bridge

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }
        android {
            compileSdkVersion 31
            defaultConfig {
                applicationId "com.evofox.bridge"
                minSdkVersion 21
                targetSdkVersion 31
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
            kotlinOptions {
                jvmTarget = '1.8'
            }
        }
        dependencies {
            implementation "org.jetbrains.kotlin:kotlin-stdlib:1.5.31"
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.evofox.bridge">
            <uses-permission android:name="android.permission.BLUETOOTH" />
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
            <application
                android:allowBackup="true"
                android:label="EvoFox Bridge"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/evofox/bridge/MainActivity.kt
        package com.evofox.bridge
        import android.app.Activity
        import android.os.Bundle
        import android.view.Gravity
        import android.view.InputDevice
        import android.view.KeyEvent
        import android.view.MotionEvent
        import android.widget.TextView

        class MainActivity : Activity() {
            private lateinit var statusText: TextView
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                statusText = TextView(this).apply {
                    text = "EvoFox Bridge Ready!\n\nConnect controller via OTG\nand press any button to test."
                    textSize = 20f
                    gravity = Gravity.CENTER
                }
                setContentView(statusText)
            }
            override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                if (event.action == KeyEvent.ACTION_DOWN) {
                    statusText.text = "Button Pressed: KeyCode ${event.keyCode}"
                    return true
                } else if (event.action == KeyEvent.ACTION_UP) {
                    statusText.text = "Button Released: KeyCode ${event.keyCode}"
                    return true
                }
                return super.dispatchKeyEvent(event)
            }
            override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
                if (event.source and InputDevice.SOURCE_JOYSTICK != 0) {
                    val x = event.getAxisValue(MotionEvent.AXIS_X)
                    val y = event.getAxisValue(MotionEvent.AXIS_Y)
                    statusText.text = "Joystick Moved:\nX: $x\nY: $y"
                    return true
                }
                return super.dispatchGenericMotionEvent(event)
            }
        }
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EvoFox-Bridge-App
        path: app/build/outputs/apk/debug/app-debug.apk
